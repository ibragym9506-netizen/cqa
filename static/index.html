<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CQA Desk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"><style>/* CQA Desk — рабочий стол проверяющего.
   Композиция: узкая верхняя панель с разделами, сводка с главным числом, затем рабочие экраны.
   Карточка диалога делится на транскрипт-переписку слева и оценки по критериям справа.
   Все стили под префиксом .cqa, поэтому интерфейс можно встроить в Dynamics 365 как HTML web resource. */
:root {
  --bg: #f1f4f8; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #0f1722; --ink-2: #3f4a5a; --mute: #647084;
  --line: #dbe2ea; --line-2: #e7ecf2;
  --accent: #2a78d6; --accent-d: #256abf; --accent-ink: #ffffff; --accent-soft: #e6effb; --accent-text: #1c5cab;
  --viz: #2a78d6; --viz-hover: #1c5cab; --viz-track: #e1e9f4;
  --good-fill: #0ca30c; --good-ink: #006300; --good-soft: #e2f4e2;
  --warn-fill: #fab219; --warn-ink: #8a5a00; --warn-soft: #fdf2d6;
  --bad-fill: #d03b3b; --bad-ink: #b02a2a; --bad-soft: #fbe6e6;
  --na-ink: #566377; --na-soft: #e8ecf1;
  --mark: #e8a900; --mark-soft: #fff3cd; --mark-ink: #6b4a00;
  --client-bg: #ffffff; --op-bg: #e6effb; --bot-bg: #f1eef8; --sys-ink: #647084;
  --shadow: 0 1px 2px rgba(15, 23, 34, .05), 0 8px 24px rgba(15, 23, 34, .05);
  --overlay: rgba(10, 16, 26, .5);
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1017; --surface: #131a23; --surface-2: #19222d; --ink: #e8edf4; --ink-2: #b8c2cf; --mute: #8995a7;
    --line: #263140; --line-2: #1e2935;
    --accent: #2a78d6; --accent-d: #3987e5; --accent-soft: #15263c; --accent-text: #86b6ef;
    --viz: #3987e5; --viz-hover: #6da7ec; --viz-track: #1c2a3b;
    --good-fill: #0ca30c; --good-ink: #3fc24a; --good-soft: #10281a;
    --warn-fill: #fab219; --warn-ink: #fab219; --warn-soft: #2c2411;
    --bad-fill: #d03b3b; --bad-ink: #f08080; --bad-soft: #331b1d;
    --na-ink: #9aa6b8; --na-soft: #202a37;
    --mark: #f2b705; --mark-soft: #382d0f; --mark-ink: #f5d27a;
    --client-bg: #19222d; --op-bg: #15263c; --bot-bg: #1f1d2e; --sys-ink: #8995a7;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3); --overlay: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1017; --surface: #131a23; --surface-2: #19222d; --ink: #e8edf4; --ink-2: #b8c2cf; --mute: #8995a7;
  --line: #263140; --line-2: #1e2935;
  --accent: #2a78d6; --accent-d: #3987e5; --accent-soft: #15263c; --accent-text: #86b6ef;
  --viz: #3987e5; --viz-hover: #6da7ec; --viz-track: #1c2a3b;
  --good-fill: #0ca30c; --good-ink: #3fc24a; --good-soft: #10281a;
  --warn-fill: #fab219; --warn-ink: #fab219; --warn-soft: #2c2411;
  --bad-fill: #d03b3b; --bad-ink: #f08080; --bad-soft: #331b1d;
  --na-ink: #9aa6b8; --na-soft: #202a37;
  --mark: #f2b705; --mark-soft: #382d0f; --mark-ink: #f5d27a;
  --client-bg: #19222d; --op-bg: #15263c; --bot-bg: #1f1d2e; --sys-ink: #8995a7;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3); --overlay: rgba(0, 0, 0, .62);
  color-scheme: dark;
}
body { margin: 0; background: var(--bg); color: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }

.cqa { font: 14px/1.5 var(--f-body); color: var(--ink); background: var(--bg); min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); -webkit-text-size-adjust: 100%; }
.cqa *, .cqa *::before, .cqa *::after { box-sizing: border-box; }
.cqa button, .cqa input, .cqa select, .cqa textarea { font: inherit; color: inherit; }
.cqa :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cqa .mono, .cqa .id { font-family: var(--f-mono); font-size: .93em; }
.cqa .ic { flex: none; vertical-align: -2px; }
.cqa h1, .cqa h2, .cqa h3, .cqa h4, .cqa p { margin: 0; }
.cqa h1, .cqa h2 { text-wrap: balance; }

/* --- верхняя панель --- */
.cqa-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.cqa-head-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.cqa-brand { display: flex; align-items: center; gap: 10px; }
.cqa-mark { width: 32px; height: 32px; flex: none; }
.cqa-mark rect { fill: var(--accent); }
.cqa-mark path { fill: #fff; }
.cqa-mark .chk { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cqa-logo { font-weight: 700; font-size: 16px; letter-spacing: -.01em; line-height: 1.1; }
.cqa-sub { font-size: 11px; color: var(--mute); line-height: 1.2; }
.cqa-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.cqa-tab { border: 0; background: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; color: var(--mute); font-weight: 600; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.cqa-tab:hover { background: var(--surface-2); color: var(--ink); }
.cqa-tab.on { background: var(--accent-soft); color: var(--accent-text); }
.cqa-count { background: var(--bad-fill); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 7px; line-height: 18px; font-weight: 700; }
.cqa-head-r { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.cqa-clsel { width: 240px; max-width: 100%; }
.cqa-icon-btn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: inline-grid; place-items: center; color: var(--ink-2); padding: 0; font-size: 18px; line-height: 1; }
.cqa-icon-btn:hover { background: var(--surface-2); }

.cqa-main { max-width: 1320px; margin: 0 auto; padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }

/* --- общие элементы --- */
.cqa-h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
.cqa-h1.sm { font-size: 20px; letter-spacing: -.01em; }
.cqa-h2 { font-size: 16px; font-weight: 650; line-height: 1.3; letter-spacing: -.005em; }
.cqa-h3 { font-size: 13px; font-weight: 650; margin-bottom: 8px; }
.cqa-lead { color: var(--ink-2); max-width: 68ch; margin-top: 8px; }
.cqa-mute { color: var(--mute); } .cqa-small { font-size: 12px; }
.cqa-spacer { flex: 1; }
.cqa-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cqa-row > input[type=text] { flex: 1; min-width: 160px; }
.cqa-right { display: flex; justify-content: flex-end; margin-top: 14px; }
.cqa-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cqa-card.flush { padding: 0; overflow: hidden; }
.cqa-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.cqa-stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 860px) { .cqa-cols { grid-template-columns: minmax(0, 1fr); } }

.cqa-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; justify-content: center; line-height: 1.2; text-align: center; }
.cqa-btn:hover { background: var(--surface-2); border-color: var(--mute); }
.cqa-btn:disabled { opacity: .5; cursor: default; }
.cqa-btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cqa-btn.pri:hover { background: var(--accent-d); border-color: var(--accent-d); }
.cqa-btn.dng { color: var(--bad-ink); }
.cqa-btn.dng.armed { background: var(--bad-fill); border-color: var(--bad-fill); color: #fff; }
.cqa-btn.sm { padding: 5px 10px; font-size: 12px; }
.cqa-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.cqa-linkbtn { border: 0; background: none; padding: 0; color: var(--accent-text); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }
.cqa-link { color: var(--accent-text); display: inline-flex; gap: 6px; align-items: center; }

.cqa input[type=text], .cqa input[type=number], .cqa select, .cqa textarea { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); width: 100%; min-width: 0; }
.cqa select { width: auto; max-width: 100%; }
.cqa textarea { min-height: 76px; resize: vertical; }
.cqa textarea.big { min-height: 260px; font-family: var(--f-mono); font-size: 12px; }
.cqa label.f, .cqa .f { display: block; font-size: 12px; color: var(--mute); margin: 0 0 4px; }
.cqa label.chk { display: flex; gap: 6px; align-items: center; }
.cqa-field { display: flex; flex-direction: column; min-width: 0; }

.cqa-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 99px; background: var(--na-soft); color: var(--na-ink); font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1.5; }
.cqa-chip.ok { background: var(--good-soft); color: var(--good-ink); } .cqa-chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
.cqa-chip.bad { background: var(--bad-soft); color: var(--bad-ink); } .cqa-chip.info { background: var(--accent-soft); color: var(--accent-text); }
.cqa-lang { font-family: var(--f-mono); font-size: 11px; font-weight: 600; padding: 1px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink-2); background: var(--surface-2); }
.cqa-src { font-size: 12px; color: var(--mute); } .cqa-src.model { color: var(--accent-text); font-weight: 600; }
.cqa-badge { display: inline-flex; gap: 5px; align-items: center; padding: 2px 10px; border-radius: 99px; font-weight: 650; font-size: 12px; white-space: nowrap; }
.cqa-badge.yes { background: var(--good-soft); color: var(--good-ink); } .cqa-badge.no, .cqa-badge.flag { background: var(--bad-soft); color: var(--bad-ink); }
.cqa-badge.na { background: var(--na-soft); color: var(--na-ink); } .cqa-badge.num { background: var(--accent-soft); color: var(--accent-text); }
.cqa-score { font-weight: 700; font-variant-numeric: tabular-nums; }
.cqa-score.hi { color: var(--good-ink); } .cqa-score.mid { color: var(--warn-ink); } .cqa-score.lo { color: var(--bad-ink); }
.cqa-note { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn-ink); font-size: 13px; display: block; line-height: 1.5; }
.cqa-note.red { background: var(--bad-soft); color: var(--bad-ink); } .cqa-note.blue { background: var(--accent-soft); color: var(--accent-text); } .cqa-note.green { background: var(--good-soft); color: var(--good-ink); }
.cqa-note .ic { margin-right: 4px; }
.cqa-empty { color: var(--mute); text-align: center; padding: 36px 16px; }

/* --- обзор --- */
.cqa-hero { display: flex; gap: 16px 32px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; padding: 6px 0 4px; }
.cqa-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
.cqa-kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cqa-kpi .l { font-size: 12px; color: var(--mute); }
.cqa-kpi .v { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.cqa-kpi .v span { font-size: 14px; font-weight: 500; color: var(--mute); letter-spacing: 0; }
.cqa-kpi .v.hi { color: var(--good-ink); } .cqa-kpi .v.mid { color: var(--warn-ink); } .cqa-kpi .v.lo { color: var(--bad-ink); }
.cqa-kpi .s { font-size: 12px; color: var(--mute); }
.cqa-kpi.hero .v { font-size: 56px; }
@media (min-width: 900px) { .cqa-kpi.hero { grid-column: span 2; } }
@media (max-width: 899px) { .cqa-kpi.hero { grid-column: 1 / -1; } }
.cqa-kpi .v span { white-space: nowrap; }
.cqa-kpi .meter { height: 6px; border-radius: 99px; background: var(--viz-track); overflow: hidden; margin-top: 8px; } .cqa-kpi .meter i { display: block; height: 100%; background: var(--viz); }

.cqa-hist { width: 100%; height: auto; max-height: 260px; display: block; }
.cqa-hist text { font-family: var(--f-body); }
.cqa-hist .grid { stroke: var(--line-2); stroke-width: 1; } .cqa-hist .base { stroke: var(--line); stroke-width: 1; }
.cqa-hist .ax { fill: var(--mute); font-size: 11px; } .cqa-hist .val { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
.cqa-hist .bar rect { fill: var(--viz); } .cqa-hist .bar .hit { fill: transparent; }
.cqa-hist .bar:hover rect:not(.hit), .cqa-hist .bar:focus rect:not(.hit) { fill: var(--viz-hover); } .cqa-hist .bar:focus { outline: none; }
.cqa-det summary { cursor: pointer; color: var(--accent-text); font-size: 12px; }
.cqa-det .cqa-table { margin-top: 6px; max-width: 280px; }

.cqa-crows { display: flex; flex-direction: column; gap: 10px; }
.cqa-crow { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 46px; gap: 2px 12px; align-items: center; }
.cqa-crow .nm { font-size: 13px; font-weight: 550; }
.cqa-crow .track, .cqa-sec .track, .cqa-sbar .track { height: 8px; border-radius: 99px; background: var(--viz-track); overflow: hidden; }
.cqa-crow .track i, .cqa-sec .track i, .cqa-sbar .track i { display: block; height: 100%; background: var(--viz); border-radius: 0 4px 4px 0; }
.cqa-crow .v { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.cqa-crow .sub { grid-column: 1 / -1; font-size: 12px; color: var(--mute); }
@media (max-width: 520px) { .cqa-crow { grid-template-columns: minmax(0, 1fr) 46px; } .cqa-crow .track { grid-column: 1 / -1; grid-row: 2; } .cqa-crow .sub { grid-row: 3; } }
.cqa-lrows { display: flex; flex-direction: column; }
.cqa-lrow { display: grid; grid-template-columns: minmax(0, 1fr) 56px auto 16px; gap: 10px; align-items: center; border: 0; background: none; text-align: left; padding: 9px 4px; border-bottom: 1px solid var(--line-2); cursor: pointer; border-radius: 6px; }
.cqa-lrow:hover { background: var(--surface-2); } .cqa-lrow:last-child { border-bottom: 0; } .cqa-lrow .ic { color: var(--mute); }
.cqa-steps-l { margin: 0; padding-left: 20px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; max-width: 80ch; } .cqa-steps-l b { color: var(--ink); }
.cqa-cost-g { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .cqa-cost-out { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.cqa-cost-out > div { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; }
.cqa-cost-out .l { font-size: 12px; color: var(--mute); } .cqa-cost-out .v { font-size: 22px; font-weight: 700; letter-spacing: -.01em; } .cqa-cost-out .s { font-size: 12px; color: var(--mute); }
@media (max-width: 520px) { .cqa-cost-g { grid-template-columns: 1fr; } }
.cqa-data { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; } .cqa-data > div:first-child { max-width: 70ch; }

/* --- список и таблицы --- */
.cqa-tools .cqa-row > input[type=text] { flex: 0 1 200px; }
.cqa-tablewrap { overflow-x: auto; }
.cqa-table { width: 100%; border-collapse: collapse; min-width: 700px; }
.cqa-table.sm { min-width: 0; }
.cqa-table th { text-align: left; font-size: 12px; color: var(--mute); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; background: var(--surface); position: sticky; top: 0; }
.cqa-table th[data-act] { cursor: pointer; } .cqa-table th[data-act]:hover { color: var(--ink); }
.cqa-table td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.cqa-table td.num { font-variant-numeric: tabular-nums; }
.cqa-table tr.link { cursor: pointer; } .cqa-table tr.link:hover td { background: var(--surface-2); }
.cqa-table tr:last-child td { border-bottom: 0; }
.cqa-sbar { display: grid; grid-template-columns: 52px 90px; gap: 8px; align-items: center; }
.cqa-prog { height: 6px; background: var(--viz-track); border-radius: 99px; overflow: hidden; width: 220px; max-width: 100%; } .cqa-prog > i { display: block; height: 100%; background: var(--viz); transition: width .2s; }
.runner { margin-top: 10px; }

/* --- модальные окна и уведомления --- */
.cqa-modal-bg { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow: auto; }
.cqa-modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(720px, 100%); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; margin-block: auto; }
.cqa-toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; width: max-content; max-width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }
.cqa-toast.err { background: var(--bad-fill); color: #fff; }
.cqa-drop { display: grid; place-items: center; gap: 8px; padding: 22px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--mute); cursor: pointer; text-align: center; }
.cqa-drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.cqa-drop input { max-width: 100%; }

/* --- карточка диалога --- */
.cqa-convhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cqa-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .cqa-grid { grid-template-columns: minmax(0, 1fr); } }
.cqa-scroll { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); max-height: calc(100vh - 100px); overflow: auto; }
@media (max-width: 980px) { .cqa-scroll { position: static; max-height: 70vh; } }
#res-card { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cqa-chat { display: flex; flex-direction: column; gap: 8px; }
.cqa-msg { max-width: 90%; padding: 8px 12px 9px; border-radius: 14px; border: 1px solid var(--line); background: var(--client-bg); align-self: flex-start; scroll-margin-top: 80px; }
.cqa-msg .meta { display: flex; gap: 8px; align-items: baseline; font-size: 11px; color: var(--mute); margin-bottom: 2px; }
.cqa-msg .who { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px; }
.cqa-msg .t, .cqa-msg .no { font-family: var(--f-mono); font-size: 10.5px; } .cqa-msg .no { margin-left: auto; opacity: .7; }

      var opt = S.checklists.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === S.activeCl ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('');
      function tab(id, label, extra) { return '<button class="cqa-tab' + (r === id ? ' on' : '') + '" data-act="nav" data-to="' + id + '"' + (r === id ? ' aria-current="page"' : '') + '>' + label + (extra || '') + '</button>'; }
      return '<header class="cqa-head"><div class="cqa-head-in"><div class="cqa-brand"><svg class="cqa-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M8 11.5A3.5 3.5 0 0 1 11.5 8h9a3.5 3.5 0 0 1 3.5 3.5v6a3.5 3.5 0 0 1-3.5 3.5H15l-4.5 3.5V21A3.5 3.5 0 0 1 8 17.5z"/><path class="chk" d="M12 14.5l2.6 2.6 5.2-5.4"/></svg>' +
        '<div><div class="cqa-logo">CQA Desk</div><div class="cqa-sub">Качество диалогов операторов</div></div></div>' +
        '<nav class="cqa-tabs" aria-label="Разделы">' + tab('overview', 'Обзор') + tab('dialogs', 'Диалоги') + tab('appeals', 'Апелляции', openAp ? ' <span class="cqa-count">' + openAp + '</span>' : '') + tab('checklist', 'Чек-лист') + '</nav>' +
        '<div class="cqa-head-r">' + prov +
        '<select id="cqa-clsel" class="cqa-clsel" title="Активный чек-лист" aria-label="Активный чек-лист">' + opt + '</select>' +
        '<button class="cqa-icon-btn" data-act="theme" title="Тема: светлая / тёмная" aria-label="Переключить тему">' + ic(isDark() ? 'sun' : 'moon', 16) + '</button>' +
        '<button class="cqa-btn sm' + (S.tour ? ' on' : '') + '" data-act="tour">' + ic('play', 12) + ' Демо</button></div></div></header><main class="cqa-main" id="cqa-body"></main>';
    }
    function isDark() {
      var t = document.documentElement.getAttribute('data-theme');

    }
    function toggleTheme() {
      var next = isDark() ? 'light' : 'dark';

      route();
    }

    // ---------- загрузка ----------
    function loadBase() {
      return Promise.all([api('GET', '/config'), api('GET', '/checklists')]).then(function (r) {
        S.config = r[0]; S.checklists = r[1].checklists; S.activeCl = r[1].active;
        return loadConvs();
      });
    }
    function loadConvs() { return api('GET', '/conversations?checklist_id=' + encodeURIComponent(S.activeCl)).then(function (l) { S.convs = l; S.stats = null; }); }
    function refreshConfig() { return api('GET', '/config').then(function (c) { S.config = c; if (S.route) route(); }); }

    function route() {
      var h = (location.hash || '').replace(/^#/, '');
      S.route = ROUTES.indexOf(h) >= 0 ? h : 'overview';

      var sel = $('#cqa-clsel');
      if (sel) sel.addEventListener('change', function () {
        api('POST', '/checklists/' + encodeURIComponent(sel.value) + '/activate', {}).then(function () { S.activeCl = sel.value; S.view = null; S.clEdit = null; S.clId = null; return loadConvs(); }).then(route).catch(fail);

    // ---------- обзор ----------
    function computeStats(views) {
      var ev = views.filter(function (v) { return v.evaluated && v.final.total != null; });
      var scores = ev.map(function (v) { return v.final.total; });
      var avg = scores.length ? scores.reduce(function (a, b) { return a + b; }, 0) / scores.length : null;
      var bins = []; for (var i = 0; i < 10; i++) bins.push(0);
      scores.forEach(function (s) { bins[Math.min(9, Math.floor(s / 10))]++; });
      var order = [], crit = {};
      views.forEach(function (v) {
        v.criteria.forEach(function (c) {
          if (c.type === 'flag') return;
          var o = crit[c.id]; if (!o) { o = crit[c.id] = { id: c.id, name: c.name, sum: 0, n: 0, na: 0, full: 0 }; order.push(c.id); }
          if (!c.judged) return;
          if (c.final.state === 'scored') { var p = c.final.effective_weight ? c.final.points / c.final.effective_weight : 0; o.sum += p; o.n++; if (p >= 0.999) o.full++; }
          else if (c.final.state === 'na') o.na++;
        });
      });
      var meta = {}; S.convs.forEach(function (c) { meta[c.id] = c; });
      var groups = {}, gorder = [];
      ev.forEach(function (v) {
        var m = meta[v.conversation_id]; if (!m) return;
        var k = m.channel === 'voice call' ? 'Звонки' : 'Чаты ' + m.language;
        if (!groups[k]) { groups[k] = { name: k, sum: 0, n: 0 }; gorder.push(k); }
        groups[k].sum += v.final.total; groups[k].n++;
      });
      gorder.sort();
      var low = ev.slice().sort(function (a, b) { return a.final.total - b.final.total; }).slice(0, 6).map(function (v) { return { id: v.conversation_id, total: v.final.total, gross: v.final.gross }; });
      return { n: ev.length, total: views.length, avg: avg, bins: bins, scores: scores, crit: order.map(function (id) { return crit[id]; }),
        groups: gorder.map(function (k) { return groups[k]; }), low: low, gross: views.filter(function (v) { return v.final.gross; }).map(function (v) { return v.conversation_id; }),
        under60: scores.filter(function (s) { return s < 60; }).length };
    }
    function histSvg(bins) {
      var W = 560, H = 210, L = 32, B = 26, T = 16, R = 6, slot = (W - L - R) / 10, bw = 24;
      var max = Math.max.apply(null, bins.concat([1])), step = max <= 5 ? 1 : max <= 12 ? 2 : max <= 25 ? 5 : 10, top = Math.ceil(max / step) * step;
      var y = function (v) { return T + (H - T - B) * (1 - v / top); };
      var g = '', i;
      for (var v = 0; v <= top; v += step) g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
      var bars = '';
      for (i = 0; i < 10; i++) {
        var x = L + slot * i + (slot - bw) / 2, h = (H - T - B) * bins[i] / top, yy = H - B - h;
        var lo = i * 10, hi = i === 9 ? 100 : i * 10 + 9;
        if (bins[i]) {
          bars += '<g class="bar" tabindex="0"><title>' + lo + '–' + hi + ' баллов: ' + bins[i] + ' ' + plural(bins[i], 'диалог', 'диалога', 'диалогов') + '</title><rect x="' + x + '" y="' + yy + '" width="' + bw + '" height="' + Math.max(h, 0) + '" rx="' + Math.min(4, h / 2) + '"/>' +
            (h > 5 ? '<rect x="' + x + '" y="' + (H - B - Math.min(4, h)) + '" width="' + bw + '" height="' + Math.min(4, h) + '"/>' : '') +
            '<rect class="hit" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + (H - T - B) + '"/></g>';
          if (bins[i] === max) bars += '<text class="val" x="' + (x + bw / 2) + '" y="' + (yy - 5) + '" text-anchor="middle">' + bins[i] + '</text>';
        }
        bars += '<text class="ax" x="' + (L + slot * i + slot / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + lo + '</text>';
      }
      return '<svg class="cqa-hist" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Распределение итоговых баллов по диапазонам по 10 баллов">' + g + '<line class="base" x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '"/>' + bars + '</svg>';
    }
    function plural(n, a, b, c) { var m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; }

    function renderOverview(body) {
      body.innerHTML = '<div class="cqa-empty">Считаю сводку…</div>';
      api('GET', '/export?checklist_id=' + encodeURIComponent(S.activeCl)).then(function (views) {
        var st = S.stats = computeStats(views);
        var est = null; var estP = STATIC && S.config.estimate !== false ? api('GET', '/estimate').catch(function () { return null; }) : Promise.resolve(null);
        return estP.then(function (e) { drawOverview(body, st, e, views); });
      }).catch(function (e) { body.innerHTML = '<div class="cqa-note red">' + esc(e.message) + '</div>'; });
    }
    function drawOverview(body, st, est, views) {

        (modelOn() || modelDone ? 'Оценок от модели: ' + modelDone + ' из ' + st.total + '.' : 'Сейчас оценки получены эвристиками без модели: это быстрый базовый расчёт.') + '</p></div>' +
        '<div class="cqa-row"><button class="cqa-btn pri" data-act="nav" data-to="dialogs">Открыть диалоги ' + ic('arrow', 14) + '</button>' +
        (hasModel() ? '<button class="cqa-btn" data-act="evalmodel">Оценить через Gemini</button>' : '') + '</div></section>';
      // показатели
      h += '<section class="cqa-kpis">' +
        '<div class="cqa-kpi hero"><div class="l">Средний балл</div><div class="v ' + cls(st.avg) + '">' + (st.avg == null ? '—' : num(st.avg)) + '<span> / 100</span></div><div class="s">по ' + st.n + ' оценённым диалогам</div></div>' +
        '<div class="cqa-kpi"><div class="l">Оценено</div><div class="v">' + st.n + '<span> из ' + st.total + '</span></div><div class="meter"><i style="width:' + (st.total ? Math.round(st.n / st.total * 100) : 0) + '%"></i></div></div>' +
        '<div class="cqa-kpi"><div class="l">Грубые ошибки</div><div class="v ' + (st.gross.length ? 'lo' : '') + '">' + st.gross.length + '</div><div class="s">отмечены отдельно, баллы не снимают</div></div>' +
        '<div class="cqa-kpi"><div class="l">Ниже 60 баллов</div><div class="v ' + (st.under60 ? 'mid' : '') + '">' + st.under60 + '</div><div class="s">нужен разбор проверяющим</div></div>' +
        '<div class="cqa-kpi"><div class="l">Апелляции</div><div class="v">' + openAp + '<span> открыто</span></div><div class="s">всего подано ' + totalAp + '</div></div></section>';
      // распределение и критерии
      var critH = st.crit.map(function (c) {
        var pct = c.n ? Math.round(c.sum / c.n * 100) : null;
        return '<div class="cqa-crow"><div class="nm">' + esc(c.name) + '</div><div class="track"><i class="' + cls(pct) + '" style="width:' + (pct || 0) + '%"></i></div><div class="v">' + (pct == null ? '—' : pct + '%') + '</div>' +
          '<div class="sub">применим в ' + c.n + ' из ' + st.total + ' · полностью выполнен ' + c.full + (c.na ? ' · N/A ' + c.na : '') + '</div></div>';
      }).join('');
      var histCard = '<div class="cqa-card"><h2 class="cqa-h2">Распределение итоговых баллов</h2><p class="cqa-mute cqa-small">Число диалогов в каждом диапазоне по 10 баллов</p>' + histSvg(st.bins) +
        '<details class="cqa-det"><summary>Таблица данных</summary><table class="cqa-table sm"><thead><tr><th>Баллы</th><th>Диалогов</th></tr></thead><tbody>' +
        st.bins.map(function (n, i) { return '<tr><td>' + i * 10 + '–' + (i === 9 ? 100 : i * 10 + 9) + '</td><td>' + n + '</td></tr>'; }).join('') + '</tbody></table></details></div>';
      var critCard = '<div class="cqa-card"><h2 class="cqa-h2">Выполнение критериев</h2><p class="cqa-mute cqa-small">Доля набранных баллов среди диалогов, где критерий применим</p><div class="cqa-crows">' + critH + '</div></div>';
      // группы и внимание
      var grpH = st.groups.map(function (g) { var a = g.sum / g.n; return '<div class="cqa-crow"><div class="nm">' + esc(g.name) + '</div><div class="track"><i class="' + cls(a) + '" style="width:' + Math.round(a) + '%"></i></div><div class="v">' + num(a) + '</div><div class="sub">' + g.n + ' ' + plural(g.n, 'диалог', 'диалога', 'диалогов') + '</div></div>'; }).join('');
      var lowH = st.low.map(function (l) {
        return '<button class="cqa-lrow" data-act="open" data-id="' + esc(l.id) + '"><span class="id">' + esc(l.id) + '</span><span class="cqa-score ' + cls(l.total) + '">' + num(l.total) + '</span>' + (l.gross ? chip('bad', 'грубая ошибка', 'flag') : '<span></span>') + ic('arrow', 14) + '</button>';
      }).join('');
      var grossOnly = st.gross.filter(function (id) { return !st.low.some(function (l) { return l.id === id; }); }).slice(0, 4).map(function (id) {
        return '<button class="cqa-lrow" data-act="open" data-id="' + esc(id) + '"><span class="id">' + esc(id) + '</span><span></span>' + chip('bad', 'грубая ошибка', 'flag') + ic('arrow', 14) + '</button>';
      }).join('');
      var grpCard = '<div class="cqa-card"><h2 class="cqa-h2">Средний балл по каналам и языкам</h2><div class="cqa-crows">' + grpH + '</div></div>';
      var lowCard = '<div class="cqa-card"><h2 class="cqa-h2">Требуют внимания</h2><p class="cqa-mute cqa-small">Самые низкие итоги и диалоги с грубой ошибкой</p><div class="cqa-lrows">' + lowH + grossOnly + '</div></div>';

      var howCard = '<section class="cqa-card cqa-how"><h2 class="cqa-h2">Как считается итог</h2><ol class="cqa-steps-l">' +
        '<li><b>Модель выносит суждения</b> по каждому критерию: да, нет, N/A или ступень шкалы, с объяснением и номерами реплик-доказательств.</li>' +

        '<li><b>N/A исключает критерий</b>, его вес пропорционально переходит остальным, итог нормируется на 100 и округляется до двух знаков.</li>' +
        '<li><b>Грубая ошибка</b> не снимает баллы, а отмечается отдельным флагом.</li></ol></section>';
      h += '<section class="cqa-cols"><div class="cqa-stack">' + histCard + grpCard + howCard + '</div><div class="cqa-stack">' + critCard + lowCard + '</div></section>';
      // стоимость
      if (est) h += costCard(est);
      // данные
      if (STATIC) h += '<section class="cqa-card cqa-data"><div><h2 class="cqa-h2">Данные этой страницы</h2><p class="cqa-mute cqa-small">Оценки, апелляции и чек-листы хранятся в этом браузере (localStorage), на сервер ничего не отправляется. ' +
        (S.config.persisted ? '' : 'Хранилище недоступно: изменения пропадут после закрытия страницы. ') + 'Диалоги DEV встроены в страницу.</p></div><div class="cqa-row"><button class="cqa-btn" data-act="export">Экспорт результатов</button><button class="cqa-btn dng" data-act="reset" data-confirm="Точно сбросить? Пропадут оценки, апелляции и правки чек-листов">Сбросить данные</button></div></section>';
      body.innerHTML = h;
      $$('#cqa-price-i, #cqa-price-o').forEach(function (el) { el.addEventListener('input', function () { S.price[el.id === 'cqa-price-i' ? 'i' : 'o'] = Math.max(0, parseFloat(el.value) || 0); savePrice(); updateCost(est); }); });

    }

    // ---------- список диалогов ----------

    function drawRunner() {

      d.innerHTML = '<div class="cqa-tour-h"><b>Демо за 5 минут</b><span class="cqa-clock" id="tour-clock">' + (S.t0 ? clockText() : '5:00') + '</span><button class="cqa-btn sm" data-act="tour-clock">' + (S.t0 ? 'Сброс' : 'Старт') + '</button><button class="cqa-icon-btn" data-act="tour" aria-label="Закрыть">×</button></div><ol class="cqa-tour-l">' +
        TOUR.map(function (s, i) {
          return '<li class="' + (S.tourStep === i ? 'on' : '') + (S.tourDone[i] ? ' done' : '') + '"><button data-act="tour-go" data-i="' + i + '"><span class="n">' + (S.tourDone[i] ? ic('check', 12) : (i + 1)) + '</span><span class="tt">' + esc(s.t) + '</span><span class="tm">' + s.time + '</span></button>' +
            (S.tourStep === i ? '<p>' + esc(s.say) + '</p>' : '') + '</li>';
        }).join('') + '</ol>';
      layer.appendChild(d);
    }
    function clockText() { var left = Math.max(0, 300 - Math.floor((Date.now() - S.t0) / 1000)); return mmss(left).replace(/^0/, ''); }
    var clockTimer = null;
    function tourClock() {
      clearInterval(clockTimer);
      if (S.t0) clockTimer = setInterval(function () { var el = $('#tour-clock'); if (el) { el.textContent = clockText(); el.classList.toggle('late', Date.now() - S.t0 > 300000); } }, 500);
    }

    // ---------- события ----------
    root.addEventListener('input', edInput);
    root.addEventListener('change', function (e) { if (e.target.closest && e.target.closest('.cqa-ed')) edInput(e); });
    root.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { var mbs = $$('.cqa-modal-bg', layer); if (mbs.length) { mbs[mbs.length - 1].remove(); return; } if (S.openId && S.route === 'dialogs') closeConv(); }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.link')) { e.preventDefault(); e.target.click(); }
    });
    root.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]'); if (!t || !root.contains(t)) return;
      if (t.dataset.confirm && !t.classList.contains('armed')) {
        var label = t.textContent; t.classList.add('armed'); t.textContent = 'Нажмите ещё раз: ' + t.dataset.confirm.toLowerCase().replace(/\?$/, '');
        setTimeout(function () { if (t.isConnected) { t.classList.remove('armed'); t.textContent = label; } }, 3500); return;
      }
      var a = t.dataset.act, body = $('#cqa-body');
      if (!S.clEdit && /^(cl-|cr-|st-)/.test(a) ) return; // редактор ещё не отрисован (ответ сервера не пришёл)
      switch (a) {
        case 'nav': S.openId = null; go(t.dataset.to); break;
        case 'open': S.pendingFocus = null; S.prefill = ''; openConv(t.dataset.id); break;
        case 'back': closeConv(); break;
        case 'theme': toggleTheme(); break;
        case 'sort': S.sort = { k: t.dataset.k, d: S.sort.k === t.dataset.k ? -S.sort.d : 1 }; drawTable(); break;
        case 'import': importModal(); break;
        case 'export': exportModal(); break;
        case 'dl-csv': saveFile('cqa-results.csv', t.closest('.cqa-modal-bg')._data.csv, 'text/csv;charset=utf-8'); break;
        case 'dl-json': saveFile('cqa-results.json', t.closest('.cqa-modal-bg')._data.json, 'application/json'); break;
        case 'cp-csv': copyText(t.closest('.cqa-modal-bg')._data.csv, 'Данные CSV'); break;
        case 'cp-json': copyText(t.closest('.cqa-modal-bg')._data.json, 'Данные JSON'); break;
        case 'closemodal': var mb = t.closest('.cqa-modal-bg'); if (mb) mb.remove(); break;
        case 'im-json': importJson($('#im-json').value, t.closest('.cqa-modal-bg')); break;
        case 'im-url': var u = $('#im-url').value.trim(); if (!u) return toast('Вставьте ссылку', true); doImport({ url: u }, t.closest('.cqa-modal-bg')); break;
        case 'im-text': doImport({ text: $('#im-text').value, conversation_id: $('#im-id').value.trim() || undefined, language: $('#im-lang').value }, t.closest('.cqa-modal-bg')); break;
        case 'reset': api('POST', '/reset', {}).then(loadBase).then(function () { S.view = null; S.clEdit = null; S.clId = null; toast('Данные сброшены'); route(); }).catch(fail); break;
        case 'evalall': var ids = pendingIds(); if (!ids.length) return toast('Всё уже оценено выбранным оценщиком'); runEval(ids, false); break;
        case 'evalmodel': S.mode = 'auto'; var ids2 = pendingIds(); if (!ids2.length) return toast('Все диалоги уже оценены Gemini'); go('dialogs'); setTimeout(function () { runEval(ids2, false); }, 150); break;
        case 'stoprun': if (S.runner) S.runner.stop = true; break;
        case 'evalone': case 'reeval-model': case 'reeval-rules':
          var useModel = a === 'reeval-model' || (a === 'evalone' && modelOn()), lbl = t.textContent;
          $$('[data-act=evalone],[data-act=reeval-model],[data-act=reeval-rules]').forEach(function (b) { b.disabled = true; }); t.textContent = 'Оцениваю…';
          api('POST', '/evaluate', { conversation_id: S.record.conversation_id, checklist_id: S.activeCl, force: a !== 'evalone', mode: useModel ? modelMode() : 'rules' })
            .then(function (v) { S.view = v; renderResult(); return loadConvs(); }).catch(function (er) { renderResult(); fail(er); }); break;
        case 'range': highlight(range(+t.dataset.a, +t.dataset.b), true); seekAudio(+t.dataset.a); break;
        case 'ev': highlight([+t.dataset.i], true); seekAudio(+t.dataset.i); break;
        case 'evall': var evs = (critById(t.dataset.cid).original.evidence || []); highlight(evs, true); if (evs.length) seekAudio(Math.min.apply(null, evs)); break;
        case 'seek': seekAudio(+t.dataset.i); highlight([+t.dataset.i], false); break;
        case 'appeal': S.prefill = ''; appealForm(t.dataset.cid); break;
        case 'form-close': var sl = slot(t.dataset.cid); if (sl) sl.innerHTML = ''; else { var mm = t.closest('.cqa-modal-bg'); if (mm) mm.remove(); } break;
        case 'appeal-send':
          var comment = $('#ap-c').value.trim(); if (!comment) return toast('Добавьте комментарий', true);
          api('POST', '/appeals', { conversation_id: S.record.conversation_id, checklist_id: S.activeCl, criterion_id: t.dataset.cid, comment: comment }).then(function () { toast('Апелляция сохранена'); return reloadView(); }).then(function () { if (S.tour) drawTour(); }).catch(fail); break;
        case 'review':
          var found = null; S.view.criteria.forEach(function (c) { c.appeals.forEach(function (ap) { if (ap.id === t.dataset.aid) found = { c: c, ap: ap }; }); });
          var s2 = slot(found.c.id); s2.innerHTML = reviewFormHtml(found.c, found.ap); bindReviewForm(s2); break;
        case 'review-modal': reviewModal(t.dataset.aid); break;
        case 'open-from-modal': var mb2 = t.closest('.cqa-modal-bg'); if (mb2) mb2.remove(); S.pendingFocus = { cid: t.dataset.cid }; openConv(t.dataset.id); break;
        case 'second':
          var sc = critById(t.dataset.cid), apl = S.view.criteria.reduce(function (acc, c) { return acc.concat(c.appeals); }, []).filter(function (x) { return x.id === t.dataset.aid; })[0] || S.appeals.filter(function (x) { return x.id === t.dataset.aid; })[0];
          var box = $('#rv-second', t.closest('.cqa-form')); t.disabled = true; box.innerHTML = '<span class="cqa-mute cqa-small">Gemini проверяет диалог…</span>';
          api('POST', '/second-opinion', { conversation_id: S.record.conversation_id, checklist_id: S.activeCl, criterion_id: t.dataset.cid, comment: apl.comment }).then(function (j) {
            t.disabled = false; box.innerHTML = '<div class="cqa-note blue"><b>Второе мнение Gemini:</b> ' + esc(ansLabel(sc, j.answer)) + '. ' + esc(j.explanation) + ' ' + evChips(j.evidence) + '<div class="cqa-small">Это подсказка: решение принимает проверяющий.</div></div>';
          }).catch(function (er) { t.disabled = false; box.innerHTML = ''; fail(er); }); break;
        case 'decide':
          var scope = t.closest('.cqa-form') || root, dec = $('input[name=dec]:checked', scope).value, reason = $('#rv-reason', scope).value.trim();
          if (!reason) return toast('Укажите причину решения', true);
          var payload = { decision: dec, reason: reason }; if (dec === 'change') payload.new_answer = $('#rv-ans', scope).value;
          var modalEl = t.closest('.cqa-modal-bg');
          api('POST', '/appeals/' + encodeURIComponent(t.dataset.aid) + '/decision', payload).then(function (r) {
            var v = r.view; toast('Решение сохранено. Итог: ' + num(v.original.total) + ' → ' + num(v.final.total));
            if (modalEl) modalEl.remove();
            if (S.record && S.record.conversation_id === v.conversation_id && S.route === 'dialogs' && S.openId) { S.view = v; renderResult(); return loadConvs(); }
            return loadConvs().then(function () { renderAppeals($('#cqa-body')); });
          }).catch(fail); break;
        // чек-лист
        case 'cr-add': S.clEdit.criteria.push({ id: 'c_' + Math.random().toString(36).slice(2, 8), section: (S.clEdit.sections[0] || {}).id || '', name: 'Новый критерий', question: 'Опишите, что именно проверять в диалоге', type: 'yesno', weight: 10, allow_na: false, na_condition: '', scale: [] }); drawEditor(body); break;
        case 'cr-del': S.clEdit.criteria.splice(+t.closest('.cqa-ed').dataset.i, 1); drawEditor(body); break;
        case 'cr-up': case 'cr-down': var i = +t.closest('.cqa-ed').dataset.i, j = a === 'cr-up' ? i - 1 : i + 1, cs = S.clEdit.criteria, tmp = cs[i]; cs[i] = cs[j]; cs[j] = tmp; drawEditor(body); break;
        case 'st-add': S.clEdit.criteria[+t.closest('.cqa-ed').dataset.i].scale.push({ value: 0, label: '' }); drawEditor(body); break;
        case 'st-del': S.clEdit.criteria[+t.closest('.cqa-ed').dataset.i].scale.splice(+t.dataset.j, 1); drawEditor(body); break;
        case 'cl-save': saveChecklist().then(function () { toast('Чек-лист сохранён'); drawEditor(body); }).catch(fail); break;
        case 'cl-apply':
          saveChecklist().then(function () {
            var cur = S.clEdit.id;
            var go2 = function () {
              var ids3 = pendingIds(); if (!ids3.length) { toast('Сохранено. Все диалоги уже оценены'); return drawEditor($('#cqa-body')); }
              toast('Сохранено. Оцениваю изменённые критерии в ' + ids3.length + ' диалогах'); runEval(ids3, false, function () { if (S.route === 'checklist') drawEditor($('#cqa-body')); });
            };
            if (cur !== S.activeCl) return api('POST', '/checklists/' + encodeURIComponent(cur) + '/activate', {}).then(function () { S.activeCl = cur; return loadConvs(); }).then(function () { route(); setTimeout(go2, 50); });
            go2();
          }).catch(fail); break;
        case 'cl-dup': api('POST', '/checklists', { from: S.clEdit.id, name: S.clEdit.name + ' (копия)' }).then(function (n) { S.clId = n.id; S.clEdit = null; return api('GET', '/checklists'); }).then(function (r) { S.checklists = r.checklists; route(); toast('Создана копия. Правьте её, исходный чек-лист не изменится'); }).catch(fail); break;
        case 'cl-active': api('POST', '/checklists/' + encodeURIComponent(S.clEdit.id) + '/activate', {}).then(function () { S.activeCl = S.clEdit.id; return loadConvs(); }).then(route).then(function () { toast('Чек-лист активен. Если критерии изменились, нажмите «Применить»'); }).catch(fail); break;
        case 'cl-del': api('DELETE', '/checklists/' + encodeURIComponent(S.clEdit.id)).then(function () { S.clId = S.activeCl; S.clEdit = null; return api('GET', '/checklists'); }).then(function (r) { S.checklists = r.checklists; route(); }).catch(fail); break;
        // демо
        case 'tour': S.tour = !S.tour; if (!S.tour) { var tr = $('#cqa-tour'); if (tr) tr.remove(); } else drawTour(); var tb = $('[data-act=tour].cqa-btn'); if (tb) tb.classList.toggle('on', S.tour); break;
        case 'tour-clock': S.t0 = S.t0 ? null : Date.now(); tourClock(); drawTour(); break;
        case 'tour-go': var k = +t.dataset.i; S.tourStep = k; S.tourDone[k] = true; if (!S.t0) { S.t0 = Date.now(); tourClock(); } TOUR[k].run(); drawTour(); break;
      }
    });
    /** Звонок: переводит плеер к реплике и запускает воспроизведение (ориентировочно: паузы записи в расшифровке не учтены). */
    function seekAudio(i) {
      var au = $('#cqa-audio'), rec = S.record; if (!au || !rec || !rec.transcript[i]) return;
      var off = secs(rec.transcript[i].timestamp) - secs(rec.transcript[0].timestamp);
      if (!isFinite(off)) return;
      try { au.currentTime = Math.max(0, off); var pr = au.play(); if (pr && pr.catch) pr.catch(function () { }); } catch (e) { /* запись ещё не загружена */ }
    }
    function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }

    global.addEventListener('hashchange', onHash);
    if (!ROUTES.some(function (r) { return '#' + r === location.hash; })) { /* стартовая вкладка — обзор */ }
    loadBase().then(route).catch(function (e) { app.innerHTML = '<main class="cqa-main"><div class="cqa-note red">Не удалось загрузить данные: ' + esc(e.message) + '</div></main>'; });

    return {
      setCaps: function (c) { if (c && c.downloads !== undefined) caps.downloads = c.downloads; },
      refresh: function () { return refreshConfig(); }
    };
  }

  global.CQA = { mount: mount };
})(window);
</script><script>/* Запуск: движок и интерфейс работают в браузере (чек-листы, апелляции, баллы).
   Если страница открыта с сервера (server.py), оценка моделью идёт через Gemini на сервере.
   Для встраивания (например, как HTML-ресурс Dynamics 365) адрес сервера задаётся window.CQA_API_BASE. */
(function () {
  try { var th = localStorage.getItem('cqa-theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) { /* без хранилища */ }
  var seed = JSON.parse(document.getElementById('cqa-seed').textContent);
  var checklist = JSON.parse(document.getElementById('cqa-checklist').textContent);
  var engine = CQAEngine.create({ seed: seed.data ? seed.data.records : seed, defaultChecklist: checklist });
  var ui = CQA.mount(document.getElementById('cqa-root'), { transport: engine.request, static: true, defaultMode: 'auto', embedAudio: true, urlImport: true });
  var base = window.CQA_API_BASE != null ? String(window.CQA_API_BASE) : '';
  if (location.protocol === 'file:' && !base) return; // открыт как файл, без сервера — только эвристики
  fetch(base + '/api/health').then(function (r) { return r.ok ? r.json() : null; }).then(function (h) {
    if (h && h.ok) { engine.setRemote(base, 'Gemini · ' + h.model + (h.votes > 1 ? ' · ' + h.votes + ' прогона' : '')); ui.refresh(); }
  }).catch(function () { /* сервер недоступен — только эвристики */ });
})();
</script></body></html>
