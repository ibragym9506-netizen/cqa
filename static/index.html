<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CQA — оценка диалогов</title><link rel="icon" href="data:,"><style>
/* CQA — минималистичный интерфейс оценки диалогов.
   Все стили под .cqa: интерфейс можно встроить в Dynamics 365 как HTML web resource, не задевая страницу. */
.cqa {
  --bg: #f6f7f9; --surface: #fff; --ink: #16181d; --ink-2: #3d434d; --mute: #6b7280; --line: #e3e6eb; --line-2: #eef0f3;
  --accent: #2459d6; --accent-soft: #eaf0fd; --accent-ink: #1d4bb8;
  --good: #137a3a; --good-soft: #e6f4ea; --bad: #b42318; --bad-soft: #fdecea; --warn: #9a6200; --warn-soft: #fdf3dc;
  --na: #5b6472; --na-soft: #eef0f3; --mark: #fff1b8;
  --op: #eaf0fd; --cl: #fff; --bot: #f3f4f6;
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg);
  min-height: 100vh; -webkit-text-size-adjust: 100%;
}
@media (prefers-color-scheme: dark) {
  .cqa {
    --bg: #0f1115; --surface: #171a20; --ink: #e8eaee; --ink-2: #c3c8d0; --mute: #8b93a1; --line: #2a2f38; --line-2: #20242c;
    --accent: #5b8cf0; --accent-soft: #1a2640; --accent-ink: #9dbcf7;
    --good: #4cc27a; --good-soft: #13281b; --bad: #f2867c; --bad-soft: #321a19; --warn: #e8b44c; --warn-soft: #2e2512;
    --na: #a0a8b5; --na-soft: #23272f; --mark: #4a3f12; --op: #1a2640; --cl: #171a20; --bot: #1f232a;
    color-scheme: dark;
  }
}
body { margin: 0; }
.cqa *, .cqa *::before, .cqa *::after { box-sizing: border-box; }
.cqa button, .cqa input, .cqa select, .cqa textarea { font: inherit; color: inherit; }
.cqa h1, .cqa h2, .cqa h3, .cqa p { margin: 0; }
.cqa :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cqa .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; font-size: .92em; }
.cqa .mute { color: var(--mute); }
.cqa .small { font-size: 12px; }

/* шапка */
.cqa-top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.cqa-top-in { max-width: 1240px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 28px; height: 56px; }
.cqa-brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.cqa-brand span { font-weight: 400; color: var(--mute); margin-left: 6px; font-size: 13px; }
.cqa-nav { display: flex; gap: 4px; height: 100%; overflow-x: auto; scrollbar-width: none; }
.cqa .cqa-nav a { display: flex; align-items: center; gap: 6px; padding: 0 12px; color: var(--mute); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.cqa .cqa-nav a:hover { color: var(--ink); }
.cqa .cqa-nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
.cqa-nav .cnt { background: var(--bad); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 6px; line-height: 17px; }
.cqa-status { margin-left: auto; font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.cqa-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); display: inline-block; }
.cqa-status.on i { background: var(--good); }
@media (max-width: 720px) { .cqa-status b { display: none; } .cqa-brand span { display: none; } .cqa-top-in { gap: 12px; } }

.cqa-main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 80px; display: flex; flex-direction: column; gap: 16px; }
.cqa-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.cqa-title h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-right: auto; }

/* элементы */
.cqa-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.cqa-btn { text-decoration: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.cqa-btn:hover { border-color: var(--mute); }
.cqa-btn:disabled { opacity: .45; cursor: default; }
.cqa-btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.cqa-btn.pri:hover { filter: brightness(1.08); }
.cqa-btn.sm { padding: 4px 10px; font-size: 12px; }
.cqa-btn.ghost { border-color: transparent; background: none; color: var(--accent-ink); padding-inline: 6px; }
.cqa-crit-h .cqa-btn.ghost { padding: 2px 6px; margin-right: -6px; font-weight: 600; }
.cqa a { color: var(--accent-ink); }
.cqa-btn.ghost:hover { background: var(--accent-soft); }
.cqa-btn.dng { color: var(--bad); }
.cqa input[type=text], .cqa input[type=number], .cqa select, .cqa textarea { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); min-width: 0; }
.cqa textarea { width: 100%; resize: vertical; min-height: 64px; }
.cqa .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cqa .grow { flex: 1; min-width: 180px; }
.cqa label.lbl { display: block; font-size: 12px; color: var(--mute); margin-bottom: 4px; }

.cqa .badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 650; white-space: nowrap; }
.cqa .badge.yes { background: var(--good-soft); color: var(--good); }
.cqa .badge.no, .cqa .badge.flag { background: var(--bad-soft); color: var(--bad); }
.cqa .badge.na { background: var(--na-soft); color: var(--na); }
.cqa .badge.num { background: var(--accent-soft); color: var(--accent-ink); }
.cqa .badge.warn { background: var(--warn-soft); color: var(--warn); }
.cqa .badge.mute { background: var(--na-soft); color: var(--mute); font-weight: 600; }
.cqa .score { font-weight: 700; font-variant-numeric: tabular-nums; }
.cqa .hi { color: var(--good); } .cqa .mid { color: var(--warn); } .cqa .lo { color: var(--bad); }
.cqa .note { padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; }
.cqa .note.warn { background: var(--warn-soft); color: var(--warn); }
.cqa .note.bad { background: var(--bad-soft); color: var(--bad); }
.cqa .empty { color: var(--mute); text-align: center; padding: 40px 16px; }

/* список */
.cqa-load { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cqa-load .url { flex: 1; min-width: 220px; }
.cqa-load .gid { width: 120px; }
.cqa-stats { display: flex; gap: 32px; flex-wrap: wrap; }
.cqa-stats div, .cqa-stats .cqa-stat { display: flex; flex-direction: column; }
.cqa-stat { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; border-radius: 8px; }
.cqa-stat span { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.cqa-stat.on { box-shadow: 0 0 0 2px var(--bad); padding: 2px 8px; margin: -2px -8px; }
.cqa-stats b { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.cqa-stats span { font-size: 12px; color: var(--mute); }
.cqa-groups { display: flex; gap: 6px; flex-wrap: wrap; }
.cqa-groups button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--mute); }
.cqa-groups button.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.cqa-table-wrap { overflow-x: auto; }
.cqa-table { width: 100%; border-collapse: collapse; min-width: 560px; }
.cqa-table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--mute); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.cqa-table td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.cqa-table tr:last-child td { border-bottom: 0; }
.cqa-table tbody tr { cursor: pointer; }
.cqa-table tbody tr:hover td { background: var(--bg); }
.cqa .bar { display: flex; align-items: center; gap: 10px; }
.cqa .bar .t { width: 90px; height: 6px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.cqa .bar .t i { display: block; height: 100%; background: currentColor; }
.cqa .bar .score { width: 48px; }
.cqa-prog { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.cqa-prog .t { width: 220px; height: 6px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.cqa-prog .t i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

/* карточка диалога */
.cqa-head { display: flex; gap: 16px 32px; align-items: center; flex-wrap: wrap; }
.cqa-total { display: flex; align-items: baseline; gap: 8px; }
.cqa-total b { font-size: 44px; line-height: 1; font-weight: 750; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.cqa-total span { color: var(--mute); }
.cqa-secs { display: flex; gap: 6px 20px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.cqa-secs b { font-variant-numeric: tabular-nums; }
.cqa-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; align-items: start; }
@media (max-width: 920px) { .cqa-split { grid-template-columns: minmax(0, 1fr); } }
.cqa-chat { position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 920px) { .cqa-chat { position: static; max-height: 70vh; } }
.cqa-audio { padding: 10px 12px; border-radius: 8px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
.cqa-audio audio { width: 100%; }
.cqa-msg { max-width: 88%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--cl); scroll-margin: 40px; transition: box-shadow .3s, background .3s; }
.cqa-msg.operator { align-self: flex-end; background: var(--op); border-color: transparent; }
.cqa-msg.bot { background: var(--bot); border-color: transparent; }
.cqa-msg.system { align-self: center; max-width: 92%; background: none; border: 0; padding: 2px 8px; text-align: center; font-size: 12px; color: var(--mute); }
.cqa-msg .who { font-size: 11px; color: var(--mute); display: flex; gap: 8px; margin-bottom: 2px; }
.cqa-msg .who b { color: var(--ink-2); font-weight: 600; }
.cqa-msg.system .who { justify-content: center; }
.cqa-msg .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.cqa-msg.hl { box-shadow: 0 0 0 2px var(--warn); background: var(--mark); }
.cqa-msg .seek { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; text-decoration: underline; font-size: 11px; }
.cqa-crits { display: flex; flex-direction: column; gap: 12px; }
.cqa-sec-h { font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; margin-top: 8px; }
.cqa-crit { display: flex; flex-direction: column; gap: 8px; }
.cqa-crit.focus { box-shadow: 0 0 0 2px var(--accent); }
.cqa-crit-h { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.cqa-crit-h h3 { font-size: 15px; font-weight: 650; }
.cqa-crit-h .meta { font-size: 12px; color: var(--mute); }
.cqa-crit-h .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.cqa-crit-h .pts { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.cqa-crit .expl { color: var(--ink-2); }
.cqa .ref { border: 0; background: var(--accent-soft); color: var(--accent-ink); border-radius: 5px; padding: 0 5px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
.cqa .ref:hover { filter: brightness(.95); }
.cqa-crit .ev { font-size: 12px; color: var(--mute); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cqa-crit .sub { font-size: 12px; color: var(--mute); }
.cqa-crit .rev { border-left: 3px solid var(--warn); padding: 6px 10px; background: var(--warn-soft); border-radius: 0 8px 8px 0; font-size: 13px; }
.cqa-crit .rev.done { border-color: var(--good); background: var(--good-soft); }
.cqa-crit .acts { display: flex; gap: 8px; }
.cqa-form { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 8px; background: var(--bg); }

/* апелляции */
.cqa-ap { display: flex; flex-direction: column; gap: 10px; }
.cqa-ap .frag { display: flex; flex-direction: column; gap: 6px; }
.cqa-ap .frag .cqa-msg { max-width: 100%; }
.cqa-ap .q { border-left: 3px solid var(--line); padding-left: 10px; color: var(--ink-2); }
.cqa-done { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.cqa-done:last-child { border-bottom: 0; }

/* чек-лист */
.cqa-ed { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.cqa-ed-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px 70px 50px 28px; gap: 12px; align-items: center; padding: 10px 14px; cursor: pointer; }
.cqa-ed-row:hover { background: var(--bg); border-radius: 10px; }
.cqa-ed-row .nm { font-weight: 600; }
.cqa-ed-row .c { font-size: 12px; color: var(--mute); }
.cqa-ed-body { border-top: 1px solid var(--line-2); padding: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.cqa-ed-body .w2 { grid-column: span 2; } .cqa-ed-body .w4 { grid-column: 1 / -1; }
.cqa-ed-body input[type=text], .cqa-ed-body input[type=number], .cqa-ed-body select { width: 100%; }
.cqa-ed-body .chk { display: flex; gap: 8px; align-items: center; padding-top: 22px; }
.cqa-scale { display: grid; grid-template-columns: 70px minmax(0, 1fr) 28px; gap: 6px; align-items: center; }
@media (max-width: 720px) { .cqa-ed-body { grid-template-columns: minmax(0, 1fr); } .cqa-ed-body .w2 { grid-column: auto; } .cqa-ed-row { grid-template-columns: minmax(0, 1fr) 60px 28px; } .cqa-ed-row .hide-sm { display: none; } }
.cqa-x { border: 0; background: none; cursor: pointer; color: var(--mute); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.cqa-x:hover { background: var(--bad-soft); color: var(--bad); }

.cqa-toast { position: fixed; left: 16px; bottom: 16px; z-index: 50; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; max-width: min(520px, calc(100vw - 32px)); font-size: 13px; }
.cqa-toast.err { background: var(--bad); color: #fff; }

/* плеер звонка: прилипает к верху переписки */
.cqa-player { position: sticky; top: -12px; z-index: 3; margin: -12px -12px 4px; padding: 12px 14px 10px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.cqa-player .pl-row { display: flex; align-items: center; gap: 8px; }
.cqa-player .pl-row:first-of-type { justify-content: space-between; }
.cqa-player input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.pl-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; height: 34px; min-width: 34px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: var(--ink-2); font-size: 11px; font-weight: 700; }
.pl-btn:hover { border-color: var(--mute); color: var(--ink); }
.pl-btn.main { background: var(--accent); border-color: var(--accent); color: #fff; width: 44px; height: 44px; }
.pl-btn.rate { margin-left: auto; min-width: 46px; font-size: 12px; }
.pl-follow { display: flex; gap: 6px; align-items: center; }
.cqa-msg.now { box-shadow: 0 0 0 2px var(--accent); }
</style></head>

          var s = v.sections.filter(function (x) { return x.id === c.section; })[0], x = v.final.sections[c.section];
          h += '<div class="cqa-sec-h"><span>' + esc(s ? s.name : c.section) + '</span>' + (x ? '<span>' + num(x.points) + ' / ' + num(x.max) + '</span>' : '') + '</div>';
        }
        h += critHtml(c, n);
      });
      return h;
    }
    function critHtml(c, n) {
      var o = c.original, f = c.final, flag = c.type === 'flag';
      var pts = flag ? 'без баллов' : f.state === 'scored' ? '<b>' + num(f.points) + '</b> из ' + num(f.effective_weight) + ' баллов' : f.state === 'na' ? 'вес перераспределён' : '';
      var h = '<div class="cqa-card cqa-crit" id="c-' + esc(c.id) + '"><div class="cqa-crit-h"><div><h3>' + esc(c.name) + '</h3><div class="meta">' + (flag ? 'отмечается отдельно' : 'вес ' + num(c.weight)) + '</div></div>' +
        '<div class="r">' + ansBadge(c, f.answer) + '<span class="pts">' + pts + '</span>' +
        (c.judged && !c.appeals.length && o.answer != null && S.form !== c.id ? '<button class="cqa-btn ghost sm" data-act="ap-form" data-cid="' + esc(c.id) + '">Оспорить</button>' : '') + '</div></div>';
      if (!c.judged) return h + '<div class="sub">Критерий ещё не оценён — нажмите «Оценить» вверху.</div></div>';
      if (o.answer === 'na' && c.na_condition && !o.explanation) h += '<p class="expl">N/A: ' + esc(c.na_condition) + '</p>';
      if (o.explanation) h += '<p class="expl">' + linkRefs(o.explanation, n) + '</p>';
      var ev = o.evidence || [];
      if (ev.length || o.checked) h += '<div class="ev">' + (ev.length ? '<span>Реплики:</span>' + ev.map(function (i) { return '<button class="ref" data-act="goto" data-i="' + i + '">№' + (i + 1) + '</button>'; }).join('') : '') +
        (o.checked && (o.answer === 'no' || (c.type === 'scale' && o.answer !== maxScale(c) && o.answer !== 'na')) ? '<span>· проверен участок <button class="ref" data-act="goto" data-i="' + o.checked[0] + '">№' + (o.checked[0] + 1) + '</button>–<button class="ref" data-act="goto" data-i="' + o.checked[1] + '">№' + (o.checked[1] + 1) + '</button></span>' : '') + '</div>';
      if (o.rule) h += '<div class="sub">Правило кода поправило модель: ' + esc(o.rule) + '</div>';
      if (o.agreement != null && o.agreement < 1) h += '<div class="sub mid">Согласие прогонов модели: ' + Math.round(o.agreement * 100) + '% — оценку стоит проверить</div>';
      c.appeals.forEach(function (a) {
        if (a.status === 'open') h += '<div class="rev"><b>Апелляция подана.</b> «' + esc(a.comment) + '» <a href="#/appeals">Рассмотреть →</a></div>';
        else h += '<div class="rev done"><b>' + (a.status === 'changed' ? 'Оценка изменена: ' + ansText(c, a.original_answer) + ' → ' + ansText(c, a.decision.new_answer) : 'Оценка подтверждена') + '.</b> ' +
          'Апелляция: «' + esc(a.comment) + '». Решение: ' + esc(a.decision.reason) + '</div>';
      });
      if (S.form === c.id) h += '<div class="cqa-form"><label class="lbl" for="ap-text">Почему оценка неверна? Проверяющий увидит комментарий и реплики.</label>' +
        '<textarea id="ap-text" placeholder="Например: оператор представился в №10, имя есть в реплике"></textarea>' +
        '<div class="row"><button class="cqa-btn pri" data-act="ap-send" data-cid="' + esc(c.id) + '">Подать апелляцию</button><button class="cqa-btn" data-act="ap-cancel">Отмена</button></div></div>';
      return h + '</div>';
    }
    function gotoMsg(i) {
      var el = $('#m' + i), chat = $('#chat'); if (!el) return;
      root.querySelectorAll('.cqa-msg.hl').forEach(function (x) { x.classList.remove('hl'); });
      el.classList.add('hl');
      scrollChat(el);
      if (S.rec && S.rec.channel === 'voice call' && S.rec.audio_url) seek(i, false);
    }
    function seek(i, play) {
      var au = $('#audio'), rec = S.rec; if (!au || !rec.transcript[i]) return;
      var off = (S.offs || offsets())[i]; if (!isFinite(off)) return;
      try { au.currentTime = Math.max(0, off); if (play) { var p = au.play(); if (p && p.catch) p.catch(function () { }); } } catch (e) { /* запись ещё не загружена */ }
    }

    // ======================= АПЕЛЛЯЦИИ =======================
    function drawAppeals() {
      var open = S.appeals.filter(function (a) { return a.status === 'open'; }), done = S.appeals.filter(function (a) { return a.status !== 'open'; });
      var h = '<div class="cqa-title"><h1>Апелляции</h1></div>';
      if (!S.appeals.length) h += '<div class="cqa-card empty">Апелляций нет. Откройте диалог и нажмите «Оспорить» у нужного критерия.</div>';
      if (open.length) h += '<div id="ap-open" class="cqa-crits"></div>';
      if (done.length) h += '<h2 style="font-size:15px;margin-top:8px">Рассмотренные</h2><div class="cqa-card" style="padding:4px 16px">' + done.map(doneHtml).join('') + '</div>';
      page.innerHTML = h;
      if (!open.length) return;
      // для каждой открытой апелляции нужен текст реплик и описание критерия
      Promise.all(open.map(function (a) { return api('GET', '/conversations/' + encodeURIComponent(a.conversation_id) + '?checklist_id=' + encodeURIComponent(a.checklist_id)); }))
        .then(function (rs) { $('#ap-open').innerHTML = open.map(function (a, k) { return openHtml(a, rs[k]); }).join(''); }).catch(fail);
    }
    function openHtml(a, r) {
      var c = r.view.criteria.filter(function (x) { return x.hash === a.criterion_hash; })[0], tr = r.record.transcript;
      if (!c) return '<div class="cqa-card">' + esc(a.conversation_id) + ': критерий «' + esc(a.criterion_name) + '» изменён в чек-листе. Оцените диалог заново.</div>';
      var ev = (a.evidence || []).slice(0, 4);
      var frag = ev.map(function (i) { var m = tr[i]; return m ? '<div class="cqa-msg ' + m.speaker + '"><div class="who"><b>№' + (i + 1) + ' ' + (WHO[m.speaker] || '') + '</b></div><div class="txt">' + esc(m.text) + '</div></div>' : ''; }).join('');
      var opts = allowed(c).filter(function (x) { return x !== a.original_answer; }).map(function (x) { return '<option value="' + x + '">' + ansText(c, x) + '</option>'; }).join('');
      return '<div class="cqa-card cqa-ap" data-aid="' + esc(a.id) + '">' +
        '<div class="row" style="justify-content:space-between"><div><b>' + esc(c.name) + '</b> <span class="mute">· <a href="#/d/' + encodeURIComponent(a.conversation_id) + '" class="mono">' + esc(a.conversation_id) + '</a></span></div>' + ansBadge(c, a.original_answer) + '</div>' +
        '<div><span class="lbl">Комментарий к апелляции</span><div class="q">' + esc(a.comment) + '</div></div>' +
        '<div><span class="lbl">Обоснование оценки</span><div class="q">' + esc(a.original_explanation || '—') + '</div></div>' +
        (frag ? '<div><span class="lbl">Реплики-доказательства</span><div class="frag">' + frag + '</div></div>' : '') +
        '<div class="small mute" data-slot="second"></div>' +
        '<div class="cqa-form"><div class="row"><label class="row" style="gap:6px"><input type="radio" name="d-' + esc(a.id) + '" value="confirm" checked> Подтвердить</label>' +
        '<label class="row" style="gap:6px"><input type="radio" name="d-' + esc(a.id) + '" value="change"> Изменить на</label><select data-slot="new">' + opts + '</select></div>' +
        '<textarea data-slot="reason" placeholder="Причина решения (обязательно)"></textarea>' +
        '<div class="row"><button class="cqa-btn pri" data-act="decide">Сохранить решение</button>' +
        (modelOn() ? '<button class="cqa-btn" data-act="second">Второе мнение Gemini</button><span class="small mute">1 запрос</span>' : '') + '</div></div></div>';
    }
    function doneHtml(a) {
      var res = a.status === 'changed' ? 'изменена' : 'подтверждена';
      return '<div class="cqa-done"><div><b>' + esc(a.criterion_name) + '</b> <span class="mute">· <a href="#/d/' + encodeURIComponent(a.conversation_id) + '" class="mono">' + esc(a.conversation_id) + '</a></span>' +
        '<div class="small mute">Апелляция: «' + esc(a.comment) + '» · Решение: ' + esc(a.decision.reason) + '</div></div>' +
        '<span class="badge ' + (a.status === 'changed' ? 'warn' : 'mute') + '">Оценка ' + res + '</span></div>';
    }

    // ======================= ЧЕК-ЛИСТ =======================
    function drawChecklist() {
      if (!S.edit) { S.edit = JSON.parse(JSON.stringify(S.cl)); S.dirty = false; }
      var cl = S.edit, sum = cl.criteria.reduce(function (s, c) { return s + (c.type === 'flag' ? 0 : Number(c.weight) || 0); }, 0);
      var h = '<div class="cqa-title"><h1>Чек-лист</h1>' +
        '<select id="cl-sel" title="Активный чек-лист: по нему считаются баллы"' + (S.dirty ? ' disabled' : '') + '>' + S.lists.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === S.cl.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>';
      h += '<div class="cqa-card row"><div class="grow"><label class="lbl" for="cl-name">Название чек-листа</label><input type="text" id="cl-name" style="width:100%" value="' + esc(cl.name) + '"></div>' +
        '<div class="row" style="align-self:flex-end">' + (S.dirty ? '<button class="cqa-btn ghost" data-act="cl-undo">Отменить правки</button>' : '<button class="cqa-btn ghost" data-act="cl-default">Исходные критерии</button>') +
        '<button class="cqa-btn" data-act="cl-new">Сохранить как новый</button>' +
        '<button class="cqa-btn pri" data-act="cl-save"' + (S.dirty ? '' : ' disabled') + '>Сохранить</button></div></div>';
      h += '<p class="mute">Нажмите на критерий, чтобы изменить формулировку, вес, тип ответа, N/A или шкалу. Сумма весов: <b class="' + (Math.abs(sum - 100) < 1e-6 ? 'hi' : 'mid') + '">' + num(sum) + '</b>' +
        (Math.abs(sum - 100) < 1e-6 ? '' : ' — итог всё равно приводится к 100') + '.</p>';
      var todo = pending();
      if (S.runner) h += '<div class="cqa-card" id="runner">' + runnerHtml(todo) + '</div>';
      else if (!S.dirty && todo.length) h += '<div class="note row" style="justify-content:space-between"><span>По этому чек-листу в наборе <b>' + esc(S.group) + '</b> не оценено диалогов: ' + todo.length + (modelOn() ? ' (≈ ' + todo.length * votes() + ' запросов к Gemini)' : '') + '. Оценки неизменённых критериев сохраняются.</span>' +
        '<button class="cqa-btn pri" data-act="cl-apply">Применить к набору ' + esc(S.group) + '</button></div>';
      var secs = cl.sections || [];
      h += '<div class="cqa-crits">';
      var last = null;
      cl.criteria.forEach(function (c, i) {
        if (c.section !== last) { last = c.section; var s = secs.filter(function (x) { return x.id === c.section; })[0]; h += '<div class="cqa-sec-h"><span>' + esc(s ? s.name : c.section || 'Без секции') + '</span></div>'; }
        h += '<div class="cqa-ed"><div class="cqa-ed-row" data-act="cl-open" data-i="' + i + '"><span class="nm">' + esc(c.name) + '</span><span class="c hide-sm">' + TYPE[c.type] + '</span>' +
          '<span class="c">' + (c.type === 'flag' ? 'без веса' : 'вес ' + num(c.weight)) + '</span><span class="c hide-sm">' + (c.allow_na && c.type !== 'flag' ? 'N/A' : '') + '</span><span class="c">' + (S.open === i ? '▴' : '▾') + '</span></div>' +
          (S.open === i ? editorHtml(c, i, secs) : '') + '</div>';
      });
      h += '</div><div><button class="cqa-btn" data-act="cl-add">+ Добавить критерий</button></div>';
      page.innerHTML = h;
    }
    function editorHtml(c, i, secs) {
      var f = function (k) { return 'data-f="' + k + '" data-i="' + i + '"'; };
      var h = '<div class="cqa-ed-body">' +
        '<div class="w2"><label class="lbl">Название</label><input type="text" ' + f('name') + ' value="' + esc(c.name) + '"></div>' +
        '<div><label class="lbl">Секция</label><select ' + f('section') + '>' + secs.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === c.section ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="lbl">Тип ответа</label><select ' + f('type') + '>' + Object.keys(TYPE).map(function (t) { return '<option value="' + t + '"' + (t === c.type ? ' selected' : '') + '>' + TYPE[t] + '</option>'; }).join('') + '</select></div>' +
        '<div class="w4"><label class="lbl">Что проверяем (это читает модель)</label><textarea ' + f('question') + '>' + esc(c.question) + '</textarea></div>';
      if (c.type !== 'flag') h += '<div><label class="lbl">Вес</label><input type="number" min="0" step="1" ' + f('weight') + ' value="' + esc(c.weight) + '"></div>' +
        '<div class="chk"><input type="checkbox" id="na' + i + '" ' + f('allow_na') + (c.allow_na ? ' checked' : '') + '><label for="na' + i + '">Можно N/A</label></div>' +
        (c.allow_na ? '<div class="w2"><label class="lbl">Когда N/A</label><input type="text" ' + f('na_condition') + ' value="' + esc(c.na_condition) + '"></div>' : '<div class="w2"></div>');
      if (c.type === 'scale') {
        h += '<div class="w4"><label class="lbl">Шкала: балл и что он означает (верхняя ступень даёт полный вес)</label><div class="cqa-scale">' +
          (c.scale || []).map(function (s, j) { return '<input type="number" data-f="sv" data-i="' + i + '" data-j="' + j + '" value="' + esc(s.value) + '"><input type="text" data-f="sl" data-i="' + i + '" data-j="' + j + '" value="' + esc(s.label) + '"><button class="cqa-x" data-act="st-del" data-i="' + i + '" data-j="' + j + '" title="Удалить ступень">×</button>'; }).join('') +
          '</div><button class="cqa-btn sm ghost" data-act="st-add" data-i="' + i + '" style="margin-top:6px">+ ступень</button></div>';
      }
      h += '<div class="w4 row" style="justify-content:flex-end"><button class="cqa-btn sm dng" data-act="cl-del" data-i="' + i + '">Удалить критерий</button></div></div>';
      return h;
    }
    function saveChecklist(asNew) {
      var cl = JSON.parse(JSON.stringify(S.edit));
      cl.criteria.forEach(function (c) {
        if (c.type === 'scale' && (!c.scale || c.scale.length < 2)) c.scale = [{ value: 10, label: 'Полностью выполнено' }, { value: 5, label: 'Частично' }, { value: 0, label: 'Не выполнено' }];
      });
      var target = Promise.resolve(cl.id);
      if (asNew) {
        if (!cl.name || S.lists.some(function (x) { return x.name === cl.name; })) cl.name = (cl.name || 'Чек-лист') + ' · ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        target = api('POST', '/checklists', { from: S.cl.id, name: cl.name }).then(function (n) { return n.id; });
      }
      return target.then(function (id) { cl.id = id; return api('PUT', '/checklists/' + encodeURIComponent(id), cl); })
        .then(function (saved) { return api('POST', '/checklists/' + encodeURIComponent(saved.id) + '/activate', {}).then(function () { return saved; }); })
        .then(function (saved) { S.cl = saved; S.edit = null; S.dirty = false; return Promise.all([loadLists(), loadConvs()]); });
    }

    // ---------- события ----------
    root.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-act]'); if (!t || !root.contains(t)) return;
      var a = t.dataset.act, i = t.dataset.i != null ? +t.dataset.i : null;
      switch (a) {
        case 'open': location.hash = '#/d/' + encodeURIComponent(t.dataset.id); break;
        case 'group': S.group = t.dataset.g; S.onlyGross = false; put(LS.group, S.group); drawList(); break;
        case 'load': {
          var url = withGroup($('#url').value.trim(), $('#gid').value.trim());
          if (!url) return toast('Вставьте ссылку GET организаторов', true);
          if (!modelOn() && !S.server) return toast('Загрузка по ссылке идёт через сервер: запустите py server.py и откройте http://localhost:8000', true);
          put(LS.url, url); t.disabled = true; t.textContent = 'Загрузка…';
          api('POST', '/import', { url: url }).then(function (r) { return afterImport(r, 'Загружено'); }).catch(function (e) { fail(e); t.disabled = false; t.textContent = 'Загрузить'; });
          break;
        }
        case 'run': {
          var todo = pending().map(function (c) { return c.id; });
          if (modelOn() && !confirm('Оценить ' + todo.length + ' диалогов набора ' + S.group + ' через Gemini?\nЭто ≈ ' + todo.length * votes() + ' запросов из дневного лимита.')) return;
          runEval(todo, 'Оценка'); break;
        }
        case 'stop': if (S.runner) { S.runner.stop = true; t.disabled = true; t.textContent = 'Останавливаю…'; } break;
        case 'export': exportData(t.dataset.f); break;
        case 'paste-open': S.paste = true; drawList(); setTimeout(function () { var x = $('#paste'); if (x) x.focus(); }, 0); break;
        case 'paste-close': S.paste = false; drawList(); break;
        case 'paste-load': {
          var txt = ($('#paste').value || '').trim(); if (!txt) return toast('Вставьте текст диалога', true);
          var body; try { body = JSON.parse(txt); } catch (e) { body = { text: txt }; }
          api('POST', '/import', body).then(function (r) { S.paste = false; return afterImport(r, 'Загружено'); }).catch(fail);
          break;
        }
        case 'submit': submit(); break;
        case 'only-gross': S.onlyGross = !S.onlyGross; drawList(); break;
        // карточка
        case 'eval-one': {
          var force = t.dataset.force === '1';
          if (force && modelOn() && !confirm('Переоценить все критерии этого диалога? Это ' + votes() + ' запроса к Gemini.')) return;
          t.disabled = true; t.textContent = 'Оцениваю…';
          api('POST', '/evaluate', { conversation_id: S.rec.conversation_id, checklist_id: S.cl.id, mode: modelOn() ? 'llm' : 'rules', force: force })
            .then(function (v) { S.view = v; drawDialog(); toast('Готово: ' + num(v.final.total) + ' из 100'); return loadConvs(); })
            .catch(function (e) { fail(e); t.disabled = false; t.textContent = 'Повторить'; });
          break;
        }
        case 'goto': gotoMsg(i); break;
        case 'seek': seek(i, true); break;
        case 'pl-play': case 'pl-skip': case 'pl-rate': case 'pl-prev': case 'pl-next': playerAct(a, t); break;
        case 'ap-form': S.form = t.dataset.cid; drawDialog(); setTimeout(function () { var x = $('#ap-text'); if (x) { x.focus(); x.closest('.cqa-crit').scrollIntoView({ block: 'center' }); } }, 0); break;
        case 'ap-cancel': S.form = null; drawDialog(); break;
        case 'ap-send': {
          var text = $('#ap-text').value.trim(); if (!text) return toast('Напишите комментарий', true);
          api('POST', '/appeals', { conversation_id: S.rec.conversation_id, checklist_id: S.cl.id, criterion_id: t.dataset.cid, comment: text })
            .then(function () { S.form = null; toast('Апелляция подана. Её видит проверяющий в разделе «Апелляции»'); return Promise.all([openDialog(S.rec.conversation_id), loadAppeals(), loadConvs()]); }).catch(fail);
          break;
        }
        // апелляции
        case 'decide': {
          var box = t.closest('[data-aid]'), aid = box.dataset.aid, d = box.querySelector('input[type=radio]:checked').value;
          var body = { decision: d, reason: box.querySelector('[data-slot=reason]').value.trim() };
          if (d === 'change') body.new_answer = box.querySelector('[data-slot=new]').value;
          if (!body.reason) return toast('Укажите причину решения', true);
          api('POST', '/appeals/' + encodeURIComponent(aid) + '/decision', body).then(function (r) {
            toast('Решение сохранено. Итог диалога ' + r.view.conversation_id + ': ' + num(r.view.original.total) + ' → ' + num(r.view.final.total));
            return Promise.all([loadAppeals(), loadConvs()]);
          }).then(drawAppeals).catch(fail);
          break;
        }
        case 'second': {
          var bx = t.closest('[data-aid]'), ap = S.appeals.filter(function (x) { return x.id === bx.dataset.aid; })[0], slot = bx.querySelector('[data-slot=second]');
          t.disabled = true; slot.textContent = 'Gemini перепроверяет критерий…';
          api('POST', '/second-opinion', { conversation_id: ap.conversation_id, checklist_id: ap.checklist_id, criterion_id: ap.criterion_id, comment: ap.comment }).then(function (j) {
            var c = S.cl.criteria.filter(function (x) { return x.id === ap.criterion_id; })[0] || { type: 'yesno', scale: [] };
            var same = j.answer === ap.original_answer;
            slot.innerHTML = '<div class="note' + (same ? '' : ' warn') + '"><b>Второе мнение: ' + esc(ansText(c, j.answer)) + '.</b> ' + esc(j.explanation) + '</div>';
            if (!same) { var r = bx.querySelector('input[value=change]'); r.checked = true; var sel = bx.querySelector('[data-slot=new]'); sel.value = String(j.answer); }
            t.disabled = false;
          }).catch(function (e) { slot.textContent = ''; t.disabled = false; fail(e); });
          break;
        }
        // чек-лист
        case 'cl-open': S.open = S.open === i ? -1 : i; drawChecklist(); break;
        case 'cl-add': {
          var cs = S.edit.criteria, at = cs.length && cs[cs.length - 1].type === 'flag' ? cs.length - 1 : cs.length;
          var sec = at > 0 ? cs[at - 1].section : ((S.edit.sections || [])[0] || {}).id || '';
          cs.splice(at, 0,
            { id: 'c_' + Math.random().toString(36).slice(2, 8), section: sec, name: 'Новый критерий', question: 'Опишите, что проверить в работе оператора', type: 'yesno', weight: 10, allow_na: false, na_condition: '', scale: [] });
          S.open = at; S.dirty = true; drawChecklist(); break;
        }
        case 'cl-del': if (!confirm('Удалить критерий «' + S.edit.criteria[i].name + '»?')) return; S.edit.criteria.splice(i, 1); S.open = -1; S.dirty = true; drawChecklist(); break;
        case 'st-add': S.edit.criteria[i].scale.push({ value: 0, label: '' }); S.dirty = true; drawChecklist(); break;
        case 'st-del': S.edit.criteria[i].scale.splice(+t.dataset.j, 1); S.dirty = true; drawChecklist(); break;
        case 'cl-undo': S.edit = null; S.open = -1; drawChecklist(); break;
        case 'cl-default': {
          var d0 = E.defaultChecklist(); d0.id = S.edit.id; d0.name = S.edit.name; S.edit = d0; S.open = -1; S.dirty = true; drawChecklist();
          toast('Подставлены исходные критерии организаторов. Нажмите «Сохранить» или «Сохранить как новый»'); break;
        }
        case 'cl-save': case 'cl-new': saveChecklist(a === 'cl-new').then(function () { S.open = -1; toast(a === 'cl-new' ? 'Создан и выбран чек-лист «' + S.cl.name + '»' : 'Чек-лист сохранён'); drawChecklist(); }).catch(fail); break;
        case 'cl-apply': runEval(pending().map(function (c) { return c.id; }), 'Применение чек-листа'); drawChecklist(); break;
      }
    });
    root.addEventListener('input', function (ev) {
      var t = ev.target;
      if (t.id === 'q') { S.q = t.value; drawTable(); return; }
      if (t.id === 'url') { var g = groupOf(t.value); if (g) $('#gid').value = g; return; }
      if (t.id === 'cl-name' && S.edit) { S.edit.name = t.value; S.dirty = true; var sb = $('[data-act=cl-save]'); if (sb) sb.disabled = false; return; }
      var f = t.dataset.f; if (!f || !S.edit) return;
      var c = S.edit.criteria[+t.dataset.i];
      if (f === 'sv') c.scale[+t.dataset.j].value = Number(t.value);
      else if (f === 'sl') c.scale[+t.dataset.j].label = t.value;
      else if (f === 'allow_na') c.allow_na = t.checked;
      else if (f === 'weight') c.weight = Number(t.value);
      else c[f] = t.value;
      S.dirty = true;
      var btn = $('[data-act=cl-save]'); if (btn) btn.disabled = false;
      if (f === 'type' || f === 'allow_na') { if (f === 'type' && c.type === 'flag') c.weight = 0; drawChecklist(); }
    });
    root.addEventListener('change', function (ev) {
      var t = ev.target;
      if (t.id === 'file' && t.files[0]) {
        t.files[0].text().then(function (txt) { var b; try { b = JSON.parse(txt.replace(/^\ufeff/, '')); } catch (e) { b = { text: txt }; } return api('POST', '/import', b); }).then(function (r) { return afterImport(r, 'Загружено из файла'); }).catch(fail);
        t.value = '';
      }
      if (t.id === 'cl-sel') {
        if (S.dirty && !confirm('Несохранённые правки пропадут. Переключить чек-лист?')) { t.value = S.cl.id; return; }
        api('POST', '/checklists/' + encodeURIComponent(t.value) + '/activate', {}).then(loadChecklist).then(loadConvs)
          .then(function () { S.edit = null; S.open = -1; drawChecklist(); toast('Выбран чек-лист «' + S.cl.name + '»'); }).catch(fail);
        return;
      }
      if (t.dataset && t.dataset.f === 'section') { S.edit.criteria[+t.dataset.i].section = t.value; S.dirty = true; drawChecklist(); }
    });

    // ---------- запуск ----------
    function setModel(m, server) {
      S.model = m; S.server = !!server; S.modelName = m ? String(m).replace(/^Gemini · /, '') : '';
      var st = $('#status'); st.className = 'cqa-status' + (m ? ' on' : '');
      st.innerHTML = '<i></i><b>' + (m ? esc(m) : server ? 'Нет ключа Gemini — эвристики' + (S.shared ? ' · общее хранилище' : '') : 'Без сервера — только эвристики') + '</b>';
      st.title = S.shared ? 'Чек-листы, оценки и апелляции хранятся на сервере (data/state.json) и общие для всех, кто открыл сайт' :
        'Данные хранятся в этом браузере';
    }
    /** Пришли правки других пользователей: обновляем данные и перерисовываем, не трогая то, что человек сейчас вводит. */
    function remoteChanged() {
      var openBefore = S.appeals.filter(function (a) { return a.status === 'open'; }).length;
      return loadChecklist().then(loadLists).then(loadConvs).then(loadAppeals).then(function () {
        var openNow = S.appeals.filter(function (a) { return a.status === 'open'; }).length;
        if (openNow > openBefore) toast('Новая апелляция от другого пользователя — раздел «Апелляции»');
        var r = location.hash.replace(/^#\/?/, '').split('/')[0] || 'list';
        var focused = document.activeElement && root.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        var typed = Array.prototype.some.call(page.querySelectorAll('textarea'), function (t) { return t.value.trim(); });
        if (S.runner && S.runner.running) return;
        if (r === 'list' && !S.paste && !focused) drawList();
        else if (r === 'appeals' && !typed && !focused) drawAppeals();
        else if (r === 'd' && S.rec && !S.form && !focused) openDialog(S.rec.conversation_id);
        else if (r === 'checklist' && !S.dirty) { S.edit = null; drawChecklist(); }
      });
    }
    loadChecklist().then(loadLists).then(loadConvs).then(loadAppeals).then(route).catch(function (e) { page.innerHTML = '<div class="note bad">Не удалось загрузить данные: ' + esc(e.message) + '</div>'; });
    return {
      online: function (model, votesN, asr, shared) { S.votes = votesN || 3; S.asr = !!asr; S.shared = !!shared; S.noKey = !model; setModel(model ? model + (shared ? ' · общее хранилище' : '') : null, true); return loadChecklist().then(loadLists).then(loadConvs).then(loadAppeals).then(route); },
      remoteChanged: function () { return remoteChanged(); }
    };
  }
  global.CQA = { mount: mount };
})(window);
</script>
<script>/* Запуск. Движок (чек-листы, баллы, апелляции, хранение) работает в браузере; оценку через Gemini
   и загрузку по ссылке организаторов делает server.py. Для Dynamics 365 адрес сервера — window.CQA_API_BASE. */
(function () {
  var seed = JSON.parse(document.getElementById('cqa-seed').textContent);
  var checklist = JSON.parse(document.getElementById('cqa-checklist').textContent);
  var data = seed.data || {};
  var engine = CQAEngine.create({ seed: data.records || seed, seedGroup: data.dataset_group_id || 'DEV', defaultChecklist: checklist, autoRules: false, storageKey: 'cqa-v2' });
  var ui = CQA.mount(document.getElementById('cqa-root'), { transport: engine.request, engine: engine });
  var base = window.CQA_API_BASE != null ? String(window.CQA_API_BASE) : '';
  if (location.protocol === 'file:' && !base) return; // открыт как файл — работаем без модели
  fetch(base + '/api/health').then(function (r) { return r.ok ? r.json() : null; }).then(function (h) {
    if (!h || !h.ok) return;
    engine.setRemote(base, h.model);
    // общее хранилище на сервере: сначала сливаем свою копию с серверной, потом подставляем готовые оценки
    var shared = engine.attachServer(function () { ui.remoteChanged(); }).catch(function () { return false; });
    var pre = fetch(base + '/api/precomputed').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });
    return Promise.all([shared, pre]).then(function (x) { engine.preload(x[1]); return ui.online(h.llm === false ? null : 'Gemini · ' + h.model, h.votes, h.asr, x[0]); });
  }).catch(function () { /* сервер недоступен — только эвристики */ });
})();
</script>
